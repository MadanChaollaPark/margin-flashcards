<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <main>
    <header>
      <div class="brand"><img src="icon.svg" alt=""><h1>Margin</h1></div>
      <nav aria-label="Margin pages"><a href="library.html" target="_blank">Cards</a><a href="options.html" target="_blank">Options</a></nav>
    </header>
    <p id="demo-banner" class="demo-banner" hidden>DEMO MODE (simulated AI)</p>
    <section class="surface stack" aria-labelledby="due-total">
      <h2 id="due-total" class="due-total" aria-live="polite">Loading cards…</h2>
      <ul id="deck-list" class="plain-list"></ul>
      <a class="button review-cta" id="review-due" href="review.html" target="_blank">Review due cards</a>
    </section>
    <div class="actions">
      <button class="secondary" id="open-panel" type="button">Open side panel</button>
    </div>
    <p id="toast" class="toast" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
